[package]
name = "tuiya"
version = "0.1.0"
edition = "2024"
description = "A console player for Yandex Music"
license = "MIT"

[profile.release]
# Stripping at link time keeps the macOS ad-hoc signature intact, which a
# separate `strip` run after `lipo` would invalidate.
strip = "symbols"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
flate2 = "1"
hmac = "0.13.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
rodio = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11.0"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
rand = "0.9"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFRunLoop", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSValue", "NSString"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
