[package]
name = "tuiya"
version = "0.1.0"
edition = "2024"
description = "A console player for Yandex Music"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
hmac = "0.13.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
rodio = "0.22.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
rand = "0.9"
